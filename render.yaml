services:
  - type: web
    name: cancion-bot
    runtime: python
    plan: starter
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    # "/" ahora redirige a la landing (/cancion) en vez de servir el
    # health-check - el check de salud de Render se movio aca para no
    # depender de que la raiz siga devolviendo 200 en vez de un redirect.
    healthCheckPath: /healthz
    disk:
      name: cancion-bot-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      - key: ADMIN_CHAT_ID
        sync: false
      - key: ADMIN_PANEL_PASSWORD
        sync: false
      - key: ACEDATACLOUD_API_TOKEN
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: BASE_URL
        sync: false
      - key: MAILGUN_API_KEY
        sync: false
      - key: MAILGUN_DOMAIN
        sync: false
      - key: MAILGUN_FROM_EMAIL
        sync: false
      - key: DLOCAL_API_KEY
        sync: false
      - key: DLOCAL_SECRET_KEY
        sync: false
      - key: DLOCAL_ENV
        sync: false
      - key: PRECIO_MXN
        sync: false
      - key: PRECIO_TEXTO
        sync: false
      - key: DB_PATH
        value: "/data/orders.db"
      - key: POLL_INTERVAL_SECONDS
        value: "60"
      - key: POLL_INTERVAL_STUCK_SECONDS
        value: "90"
      - key: PENDING_PAYMENT_MAX_HORAS
        value: "48"
      - key: META_PIXEL_ID
        sync: false
      - key: META_CAPI_ACCESS_TOKEN
        sync: false
      - key: META_CAPI_TEST_EVENT_CODE
        sync: false
      - key: GA_MEASUREMENT_ID
        sync: false
      - key: GOOGLE_ADS_CONVERSION_ID
        sync: false
      - key: GOOGLE_ADS_CONVERSION_LABEL
        sync: false
      - key: TRUSTPILOT_REVIEW_URL
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: PAYPAL_ENV
        sync: false
      - key: STRIPE_API_KEY
        sync: false
      - key: STRIPE_SECRET
        sync: false
      - key: STRIPE_ENVIROMENT
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: PRECIO_USD_SONG
        sync: false
      - key: PRECIO_TEXTO_USD_SONG
        sync: false
      - key: PRECIO_USD_VIDEO
        sync: false
      - key: PRECIO_TEXTO_USD_VIDEO
        sync: false
      - key: LAUNCH_PRICE_ENDS_AT
        sync: false
      - key: PRECIO_USD_SONG_REGULAR
        sync: false
      - key: PRECIO_TEXTO_USD_SONG_REGULAR
        sync: false
      - key: PRECIO_TIPO_CAMBIO_MXN_EN
        sync: false
      - key: ENABLE_VIDEO_TIER
        sync: false
      - key: MEDIA_DIR
        value: "/data/media"
